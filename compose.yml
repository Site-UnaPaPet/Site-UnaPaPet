services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.back

    container_name: backend

    env_file:
      - .env
    
    ports:
      - 8000:8000
    
    healthcheck:
      test: ["CMD", "curl", "i","-f", "http://localhost:8000/health"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  interface:
    build:
      context: .
      dockerfile: Dockerfile.interface

    container_name: interface

   
    env_file:
      - .env

    ports:
      - 5173:5173
    
    depends_on:
      backend:
        condition: service_healthy


  

  