name: backend

on:

    push:
        branches:
            - main
            - develop
    
    pull_request:
        branches:
            - main
            - develop

jobs:

    build:

        runs-on: ubuntu-latest

        steps:

            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                python-version: 3.14

            - name: install dependences
              run: pip install requirements.txt
            
            - name: test db
              run: python -m src.tests.db

